services:
  mysql:
    image: mysql:8.4
    container_name: tienda-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tienda          #
      MYSQL_USER: alumno
      MYSQL_PASSWORD: alumno
    ports:
      - "3307:3306"                   #
    volumes:
      - datos-mysql:/var/lib/mysql    #
    healthcheck:                      #
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 10

volumes:
  datos-mysql: