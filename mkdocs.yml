site_name: DWES · Desarrollo Web en Entorno Servidor
site_description: 2.º DAW · Módulo 0613 · Curso 2026-2027
site_author: Iván Jiménez
site_url: https://ivanjimenez.github.io/campusdevfp/dwes2627
theme:
  name: material
  language: es
  # Tipografía del sistema: la web carga igual de bien sin conexión y no
  # depende de Google Fonts. El juego de fuentes está en stylesheets/extra.css.
  font: false
  palette:
    # OJO: la primera entrada es la que el servidor deja escrita en el HTML,
    # antes de que corra ningún JavaScript. Si no lleva «scheme», Material usa
    # su índigo por defecto y la página se ve AZUL durante un instante, hasta
    # que el navegador resuelve la preferencia y salta al esquema del curso.
    # Por eso las tres entradas declaran esquema.
    #
    # Sigue la preferencia del sistema
    - media: "(prefers-color-scheme)"
      scheme: dwes
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Seguir el sistema
    # Modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: dwes
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    # Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: dwes-dark
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    # Navegación lateral plegable en vez de pestañas: con 9 unidades las
    # pestañas de arriba se amontonan y hay que apuntar con el ratón.
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    # ── código ──
    - content.code.copy         # botón de copiar en cada bloque
    - content.code.annotate     # anotaciones (1) desplegables dentro del código
    - content.code.select       # seleccionar solo el código, sin los números de línea
    - content.tabs.link         # las pestañas se sincronizan en toda la página
    - content.tooltips
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - abbr
  - admonition
  - attr_list          # necesario para ``` { .java .annotate }
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Enlace a esta sección
      toc_depth: 3

  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.details         # ??? y ???+ para las soluciones plegables
  - pymdownx.snippets
  - pymdownx.critic
  - pymdownx.inlinehilite

  # Iconos :material-*: como SVG. SIN esta extensión salen como texto literal
  # en todas las tablas comparativas del curso.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  # Casillas de los objetivos de unidad
  - pymdownx.tasklist:
      custom_checkbox: true

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true

  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css
  - stylesheets/print.css

extra_javascript:
  - javascripts/impresion.js

plugins:
  - search:
      lang: es
  # print-site debe declararse SIEMPRE el último
  - print-site:
      add_to_navigation: true
      print_page_title: "Curso completo · versión imprimible"
      print_page_basename: curso-completo
      add_print_site_banner: true
      print_site_banner_template: "docs/assets/banner-impresion.html"
      add_table_of_contents: true
      toc_title: "Índice del curso"
      toc_depth: 3
      add_full_urls: false
      enumerate_headings: true
      enumerate_headings_depth: 2
      enumerate_figures: false
      add_cover_page: true
      cover_page_template: "docs/assets/portada.html"
      include_css: true

